<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0f1317">
<title>Lowfathom — Encounter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   LOWFATHOM — combat screen
   Session 2 combat revision. Layout, telegraphs, and a fight that plays.

   Revision notes:
   - attack intents are separate from defensive stances
   - Heavy Blow uses a commitment ladder: wind up, release / draw further / defend
   - first draw is 2.7× Might; full draw is 4.7× Might
   - Wind is now Stamina
   - Read stays in the pad as an early weakness/layout prototype
   - Base passive Stamina regeneration is 0
   - Guard/Parry restores +3 Stamina and can counter at full Stamina
   - two successful defended attacks in a row upgrade the second defence to Perfect
   - Sword-only loadouts Parry instead: less protection, stronger riposte
   - Sand Throw can blind the foe and spoil its next attack
   - Guarding/parrying a Heavy Attack can leave the foe Off-Balance
   - Off-Balance foes must Steady or make a weak Glancing Attack
   - a reckless Glancing Attack keeps them Off-Balance for one more player turn
   - enemy portrait sits on the right
   - enemy information stays at the top; atmospheric space sits between sides
   - player HP and Stamina sit on the player side above the action controls

   Nothing is saved yet — refreshing the page starts you over
   with a fresh delver. That's Session 8's job.
   ============================================================ */

:root{
  --deep:#0f1317; --stone:#171d23; --panel:#1c232b;
  --rule:#2e3944; --rule-hi:#43525f;
  --bone:#c2bdb1; --dim:#7d8794;
  --lamp:#e6c288; --lamp-dim:#8a7550;
  --rust:#b4553c; --verdigris:#5f9490;
  --stamina:#6a9bc4; --warn:#d99a4e;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --slab:'Zilla Slab',Georgia,serif;
  --cond:'IBM Plex Sans Condensed',system-ui,sans-serif;
}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--deep);
  color:var(--bone);
  font-family:var(--mono);
  font-size:13px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button{
  font:inherit;color:inherit;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
:focus-visible{outline:2px solid var(--lamp);outline-offset:-3px}

/* ---------- the frame ---------- */
.arena{
  position:relative;
  display:grid;
  grid-template-rows:auto auto auto minmax(22px,1fr) auto auto auto auto auto auto;
  height:100vh;
  height:100dvh;
  max-width:480px;
  margin:0 auto;
  background:var(--stone);
  border-left:1px solid var(--rule);
  border-right:1px solid var(--rule);
  overflow:hidden;
}

/* ---------- 1. depth strip ---------- */
.strip{
  display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  padding:calc(7px + env(safe-area-inset-top)) 13px 7px;
  background:#12181e;border-bottom:1px solid var(--rule);
}
.strip .place{font-family:var(--slab);font-size:14px;color:var(--lamp)}
.strip .meta{
  font-family:var(--cond);font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--dim);white-space:nowrap;
}

/* ---------- 2. the foe — enemy territory at the top ---------- */
.foe{
  display:flex;flex-direction:column;justify-content:flex-start;
  padding:11px 13px 10px;
  background:#11171c;
  border-bottom:1px solid var(--rule);
}
.foe-top{display:flex;align-items:flex-end;gap:11px}

/* Sprite slot. 64x64 source art, nearest-neighbour, scaled by the game. */
.sprite{
  flex:0 0 108px;height:108px;
  border:1px dashed #2b353f;
  display:flex;align-items:center;justify-content:center;
  color:#39434e;font-size:30px;
  image-rendering:pixelated;
}
.foe-id{flex:1;min-width:0}
.cname{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:5px}
.cname b{font-family:var(--slab);font-size:15px;font-weight:600}
.cname .lv{font-family:var(--cond);font-size:11px;letter-spacing:.1em;color:var(--dim);white-space:nowrap}

.bar{position:relative;height:9px;background:#080b0e;border:1px solid var(--rule)}
.bar i{display:block;height:100%;transition:width .3s ease-out}
.bar.hp i{background:linear-gradient(90deg,#8e3f2c,var(--rust))}
.bar.hp.mid i{background:linear-gradient(90deg,#8a6f34,var(--warn))}
.bar.hp.low i{background:#c4442a}
.nums{
  display:flex;justify-content:space-between;margin-top:2px;
  font-family:var(--cond);font-size:10.5px;letter-spacing:.08em;color:var(--dim);
}

.tell{
  margin-top:8px;padding:4px 8px;
  border-left:2px solid var(--verdigris);background:rgba(95,148,144,.07);
  font-size:11.5px;color:#9fbdba;
}
.tell[hidden]{display:none}
.tell em{
  display:block;font-style:normal;font-family:var(--cond);font-size:9px;
  letter-spacing:.2em;text-transform:uppercase;color:var(--verdigris);
}
.statusline{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.statusline[hidden]{display:none}
.status{
  border:1px solid var(--rule-hi);padding:2px 6px;
  font-family:var(--cond);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--dim);background:#11171c;
}
.status.offbalance{border-color:var(--warn);color:var(--warn)}
.status.blinded{border-color:var(--verdigris);color:#9fbdba}

/* ---------- 3. INTENT ---------- */
.intent{
  padding:9px 13px 10px;
  border-bottom:1px solid var(--rule);
  border-left:3px solid var(--warn);
  background:rgba(217,154,78,.08);
}
.intent em{
  display:block;font-style:normal;font-family:var(--cond);
  font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--lamp-dim);
  margin-bottom:1px;
}
.intent b{
  display:block;font-family:var(--slab);font-weight:500;font-style:italic;
  font-size:19px;line-height:1.25;color:var(--warn);
}
.intent.unknown{border-left-color:var(--rule-hi);background:rgba(125,135,148,.05)}
.intent.unknown b{color:var(--dim)}

/* ---------- 3b. atmospheric gap — the space between them and you ---------- */
.battle-space{
  min-height:22px;
  background:
    radial-gradient(120% 110% at 50% 0%,rgba(37,48,58,.55) 0%,rgba(15,19,23,.18) 46%,rgba(9,12,15,.88) 100%),
    #0e1317;
  border-bottom:1px solid var(--rule);
}

/* ---------- 4. readout ---------- */
.readout{
  overflow-y:auto;max-height:19vh;
  padding:10px 13px;
  background:var(--panel);
  border-bottom:1px solid var(--rule);
}
.readout p{margin:0 0 5px}
.readout p:last-child{margin-bottom:0}
.readout .said{font-family:var(--slab);font-size:14.5px;color:var(--bone)}
.readout .hurt{color:#c0705c}
.readout .good{color:var(--verdigris)}
.readout .note{color:var(--dim);font-style:italic;font-size:12px}
.readout b{font-weight:600;color:var(--bone)}

/* ---------- 5. you ---------- */
.hero{
  padding:8px 13px 9px;
  background:#12181e;
  border-bottom:1px solid var(--rule);
}
.hero .cname{margin-bottom:4px}
.hero .cname b{font-size:13.5px}
.staminarow{display:flex;align-items:center;gap:8px;margin-top:7px}
.staminarow .lab{
  font-family:var(--cond);font-size:10.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dim);flex:0 0 auto;
}
.pips{display:flex;gap:3px;flex:1}
.pips i{flex:1;height:11px;background:#080b0e;border:1px solid var(--rule)}
.pips i.on{background:var(--stamina);border-color:#7fb0d6}
.staminarow .n{font-family:var(--cond);font-size:10.5px;color:var(--dim);flex:0 0 auto}

/* ---------- 6. preview ---------- */
.preview{padding:8px 13px 9px;background:var(--panel);border-bottom:1px solid var(--rule);min-height:56px}
.preview .ttl{
  font-family:var(--cond);font-size:9.5px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--lamp-dim);margin-bottom:2px;
}
.preview .line{color:#a5a396;font-size:13px}
.preview .cost{color:var(--stamina)}
.preview .dmg{color:var(--warn)}
.preview .bad{color:var(--rust)}
.preview.idle .line{color:var(--dim);font-style:italic}

/* ---------- 7. action pad ---------- */
.pad{
  display:grid;grid-template-columns:1fr 1fr;gap:1px;
  background:var(--rule);border-bottom:1px solid var(--rule);
  user-select:none;-webkit-user-select:none;
}
.act{
  background:#141a20;border:none;padding:13px 11px;text-align:left;
  min-height:64px;position:relative;
}
.act b{display:block;font-family:var(--slab);font-size:16px;font-weight:600;line-height:1.15}
.act span{
  display:block;font-family:var(--cond);font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--dim);margin-top:2px;
}
.act.strike b{color:var(--bone)}
.act.heavy  b{color:var(--warn)}
.act.guard  b{color:var(--stamina)}
.act.sand   b{color:#b99b6b}
.act.read   b{color:var(--verdigris)}
.act.wide{grid-column:1/-1}
.act.draw b{color:var(--warn)}

.act:disabled{background:#101418;cursor:not-allowed}
.act:disabled b{color:#3f4954}
.act:disabled span{color:#333c45}

/* armed = tapped once. Tap again to commit. */
.act.armed{background:#243039;box-shadow:inset 0 0 0 2px var(--lamp)}
.act.armed span{color:var(--lamp)}

/* this action counters what the foe just declared */
.act.counter::after{
  content:'';position:absolute;top:8px;right:8px;width:6px;height:6px;border-radius:50%;
  background:var(--verdigris);box-shadow:0 0 7px var(--verdigris);
}

/* ---------- 7b. menu row ---------- */
.pad2{
  display:grid;grid-template-columns:1fr 1fr;gap:1px;
  background:var(--rule);border-bottom:1px solid var(--rule);
  user-select:none;-webkit-user-select:none;
}
.mact{background:#141a20;border:none;padding:10px 11px;text-align:left;min-height:54px}
.mact b{display:block;font-family:var(--slab);font-size:15px;font-weight:600;line-height:1.15}
.mact span{
  display:block;font-family:var(--cond);font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--dim);margin-top:2px;
}
.mact.skills b{color:var(--lamp)}
.mact.pack b{color:var(--bone)}
.mact:disabled{background:#101418;cursor:not-allowed}
.mact:disabled b{color:#3f4954}
.mact:disabled span{color:#333c45}

/* ---------- 8. the bottom bar ---------- */
.botbtn{
  display:flex;align-items:baseline;gap:9px;
  width:100%;background:#12181e;border:none;
  border-top:1px solid var(--rule);
  padding:11px 13px calc(11px + env(safe-area-inset-bottom));
  min-height:52px;text-align:left;
}
.botbtn b{font-family:var(--slab);font-size:14px;font-weight:600;color:var(--rust)}
.botbtn span{
  font-family:var(--cond);font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--dim);
}
.botbtn[hidden]{display:none}
.botbtn:disabled{background:#101418;cursor:not-allowed}
.botbtn:disabled b,.botbtn:disabled span{color:#3f4954}
.botbtn.fatal{background:#2a1512}
.botbtn.fatal span{color:var(--rust)}
.botbtn.armed{background:#3a1c17;box-shadow:inset 0 0 0 2px var(--lamp)}
.botbtn.armed span{color:var(--lamp)}
.botbtn.go{background:#1a2229}
.botbtn.go b{color:var(--lamp)}

/* ---------- the skills sheet ---------- */
.sheet{
  position:absolute;left:0;right:0;top:0;bottom:0;
  max-width:480px;margin:0 auto;z-index:5;
  display:flex;flex-direction:column;justify-content:flex-end;
}
.sheet[hidden]{display:none}
.sheet-scrim{flex:1;min-height:0;background:rgba(8,11,14,.78)}
.sheet-panel{background:var(--panel);border-top:1px solid var(--rule)}
.sheet-head{
  display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  padding:10px 13px;border-bottom:1px solid var(--rule);background:#12181e;
}
.sheet-head h2{
  margin:0;font-family:var(--cond);font-size:10px;font-weight:600;
  letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
}
.sheet-head .slots{font-family:var(--cond);font-size:11px;letter-spacing:.1em;color:var(--lamp)}
.skill{
  display:block;width:100%;text-align:left;background:#141a20;border:none;
  border-bottom:1px solid var(--rule);padding:11px 13px;min-height:64px;
}
.skill b{font-family:var(--slab);font-size:15px;font-weight:600;color:var(--lamp)}
.skill .meta{
  float:right;font-family:var(--cond);font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--verdigris);
}
.skill p{margin:2px 0 0;font-size:12.5px;color:#a5a396;clear:both}
.skill:disabled{background:#101418;cursor:not-allowed}
.skill:disabled b{color:#4a545f}
.skill:disabled .meta{color:#3f4954}
.skill:disabled p{color:#39434e}
.skill.empty b{color:#39434e;font-style:italic}
.sheet-note{
  padding:8px 13px;font-size:11px;color:#4f5a66;
  border-bottom:1px solid var(--rule);background:#101418;
}
.sheet-back{
  width:100%;min-height:52px;background:#12181e;border:none;
  border-top:1px solid var(--rule);
  padding:13px calc(13px + env(safe-area-inset-bottom));
  font-family:var(--cond);font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--dim);text-align:center;
}

/* ---------- the end ---------- */
.dead{
  position:absolute;inset:0;z-index:10;background:var(--deep);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:30px 22px;
}
.dead h2{font-family:var(--slab);font-size:23px;color:var(--rust);margin:0 0 10px;line-height:1.25}
.dead p{color:var(--dim);margin:0 0 22px;max-width:38ch}
.dead button{
  background:#141a20;border:1px solid var(--lamp-dim);color:var(--lamp);
  padding:13px 22px;min-height:52px;
  font-family:var(--cond);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
}

@media (min-width:520px){
  body{background:#0a0d11}
  .arena{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="arena" id="arena">

  <header class="strip">
    <div class="place" id="place">The Underbarrow Crypts</div>
    <div class="meta" id="meta">—</div>
  </header>

  <section class="foe">
    <div class="foe-top">
      <div class="foe-id">
        <div class="cname"><b id="foeName">—</b><span class="lv" id="foeLv"></span></div>
        <div class="bar hp" id="foeBar"><i id="foeHp"></i></div>
        <div class="nums"><span>hp</span><span id="foeHpN"></span></div>
      </div>
      <div class="sprite" aria-hidden="true">?</div>
    </div>
    <div class="tell" id="tell" hidden>
      <em>Known weakness</em>
      <span id="tellTxt"></span>
    </div>
    <div class="statusline" id="foeStatus" hidden></div>
  </section>

  <div class="intent unknown" id="intent">
    <em>Intent</em>
    <b>—</b>
  </div>

  <div class="battle-space" aria-hidden="true"></div>

  <div class="readout" id="readout" role="log"></div>

  <section class="hero">
    <div class="cname"><b id="heroName">—</b><span class="lv" id="heroLv"></span></div>
    <div class="bar hp" id="heroBar"><i id="heroHp"></i></div>
    <div class="nums"><span>hp</span><span id="heroHpN"></span></div>
    <div class="staminarow">
      <span class="lab">Stamina</span>
      <span class="pips" id="pips"></span>
      <span class="n" id="staminaN"></span>
    </div>
  </section>

  <div class="preview idle" id="preview">
    <div class="ttl">If you commit to that</div>
    <div class="line">Tap an action to see what it costs.</div>
  </div>

  <div class="pad" id="pad"></div>

  <div class="pad2">
    <button class="mact skills" id="btnSkills"><b>Skills</b><span>2 slots left</span></button>
    <button class="mact pack" id="btnLoadout"><b>Loadout</b><span id="loadoutTxt">sword + shield</span></button>
  </div>

  <button class="botbtn" id="btnRun"><b>Run</b><span>—</span></button>
  <button class="botbtn go" id="btnGo" hidden><b>Go on down</b><span>the next encounter</span></button>


  <!-- skills sheet: sits above the pad so the fight stays readable -->
  <div class="sheet" id="sheet" hidden>
    <div class="sheet-scrim" id="scrim"></div>
    <div class="sheet-panel">
      <div class="sheet-head">
        <h2>Skills</h2>
        <span class="slots">2 of 3 slots</span>
      </div>

      <button class="skill" disabled>
        <span class="meta">1 slot</span>
        <b>Lay On Hands I</b>
        <p>Close a wound. 18 hp back. Costs a slot, not stamina.</p>
      </button>

      <button class="skill" disabled>
        <span class="meta">spent</span>
        <b>Smite I</b>
        <p>Comes back at camp. Rest returns one slot, not all of them.</p>
      </button>

      <button class="skill empty" disabled>
        <b>Empty slot</b>
        <p>Nothing slotted. Books drop in the dark.</p>
      </button>

      <div class="sheet-note">Skills aren't wired up yet — that's Session 6. This is here so you can judge how the sheet sits over a fight.</div>
      <button class="sheet-back" id="btnBack">Back to the fight</button>
    </div>
  </div>

</div>

<script>
"use strict";

/* ============================================================
   A note, since this is your first real JavaScript file.

   Everything below follows one pattern. The game's numbers live
   in an object called S. Nothing on screen updates itself. You
   change a number inside S, then call render(), and render()
   repaints every bar and label from scratch. That is why you'll
   see render() at the end of nearly every function.

   In GDScript terms: S is your member variables, and render() is
   an update_ui() that you call by hand instead of a _process()
   loop that runs every frame.
   ============================================================ */

const $ = id => document.getElementById(id);
const rnd = () => Math.random();
const ri = (a,b) => a + Math.floor(rnd()*(b-a+1));
const pick = a => a[Math.floor(rnd()*a.length)];
const clamp = (v,a,b) => Math.max(a, Math.min(b,v));
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const article = n => /^[aeiou]/i.test(n) ? `an ${n}` : `a ${n}`;


/* ============================================================
   INTENTS — the matchup layer. The whole game is here.

   Each turn the foe declares one of these. Your actions are good
   against different ones. mult is how hard its attack lands when
   it comes; armour is how much of your damage it soaks.
   ============================================================ */
const INTENTS = {
  heavy: {
    label:"Heavy attack",
    tell:"drawing back for a committed blow",
    kind:"attack", mult:2.0, armour:0
  },
  quick: {
    label:"Quick attack",
    tell:"darting in to strike",
    kind:"attack", mult:0.6, armour:0
  },
  offquick: {
    label:"Glancing attack",
    tell:"lashing out without its footing",
    kind:"attack", mult:0.3, armour:0
  },
  dodge: {
    label:"Dodge",
    tell:"circling, light on its feet",
    kind:"stance", mult:0, armour:0
  },
  guard: {
    label:"Guard",
    tell:"set behind its guard",
    kind:"stance", mult:0, armour:0.7
  },
  recover: {
    label:"Recover",
    tell:"sucking air, giving ground",
    kind:"stance", mult:0, armour:0, heal:0.14
  },
  steady: {
    label:"Steady",
    tell:"planting its feet and recovering its balance",
    kind:"stance", mult:0, armour:0
  }
};

/* Weaknesses are still a prototype. Read reveals one for the current
   species and remembers it for later encounters in this run. */
const WEAKNESSES = [
  {id:"winded",  txt:"Stamina-starves quickly. Guarding it out works.", eff:{guardBonus:1.6}},
  {id:"brittle", txt:"Brittle. Heavy blows go straight through.",       eff:{heavyBonus:1.7}},
  {id:"slow",    txt:"Slow to reset. Fast strikes chain on it.",        eff:{strikeBonus:1.5}},
  {id:"skittish",txt:"Skittish. It will not chase a retreat.",          eff:{runFree:true}}
];

const FOES = [
  {n:"war-painted kobold",tier:0}, {n:"goblin cutter",tier:0}, {n:"blind rat",tier:0},
  {n:"pale hound",tier:1},         {n:"mine wight",tier:1},    {n:"silt-crawler",tier:1},
  {n:"bone-picker",tier:2},        {n:"drowned man",tier:2},   {n:"lamp-eater",tier:2},
  {n:"hollow knight",tier:3},      {n:"choir-thing",tier:3}
];

const HIT_VERBS = ["Struck","Cut into","Caught","Opened up","Got through on","Landed on"];


/* ============================================================
   STATE
   ============================================================ */
let S = null;      // the delver, and the fight in front of them
let known = {};    // weaknesses learned so far, keyed by creature name
let armed = null;  // which action is tapped-but-not-yet-committed
let over = false;  // true once you're dead

function newDelver(){
  S = {
    name:"Leofrun Fenwick", rank:6,
    hpMax:64, hp:64,
    staminaMax:10, stamina:10,
    heavyCharge:0, // 0 = none, 1 = 2.7× prepared, 2 = 4.7× fully drawn
    defenceChain:0, // 0 = normal defence, 1 = next defended attack becomes Perfect
    loadout:"shield", // prototype toggle: "shield" = Guard, "sword" = Parry
    might:9,
    depth:148, encounter:0,
    turn:1, foe:null
  };
  known = {};
  armed = null;
  over = false;
  $("readout").innerHTML = "";
  nextFoe();
}

function nextFoe(){
  S.encounter++;
  S.turn = 1;
  S.stamina = Math.min(S.staminaMax, S.stamina + 4); // some breath back between fights
  S.heavyCharge = 0;
  S.defenceChain = 0;
  armed = null;

  const band = FOES.filter(f => f.tier === clamp(Math.floor(S.depth/70), 0, 3));
  const base = pick(band.length ? band : FOES);
  const power = 1 + S.depth/110;
  const hpMax = Math.round(ri(26,44) * power * 0.55);

  S.foe = {
    key: base.n,
    name: base.n,
    lv: Math.round(8 + S.depth/9 + ri(-2,3)),
    hp: hpMax, hpMax,
    atk: Math.round(5*power) + ri(0,3),
    weakness: known[base.n] || pick(WEAKNESSES),
    revealed: !!known[base.n],
    intent: null,
    blinded:false,          // persists until the foe next attempts an attack
    offBalance:false,        // opens damage and restricts the foe's choices
    offBalanceStruck:false   // after a reckless Glancing Attack, next intent must be Steady
  };
  rollIntent();
  say(`<p class="said">${cap(article(S.foe.name))} comes out of the dark.</p>`);
  render();
}

function rollIntent(){
  const f = S.foe;

  // Off-Balance has its own mini-state machine. The foe cannot Guard, Dodge,
  // Recover, or throw another Heavy Attack while its footing is gone.
  // It can either spend the turn Steadying, or lash out weakly. If it lashes
  // out, the player gets one more Off-Balance turn before Steady is forced.
  if(f.offBalance){
    if(f.offBalanceStruck){
      f.intent = "steady";
    } else {
      f.intent = rnd() < 0.60 ? "steady" : "offquick";
    }
    return;
  }

  let pool = ["heavy","quick","quick","dodge","guard"];
  if(f.hp < f.hpMax*0.30) pool.push("recover","recover");
  if(f.hp < f.hpMax*0.50) pool.push("heavy","dodge");
  f.intent = pick(pool);
}


/* ============================================================
   THE MATHS — all in one place, so tuning is easy later
   ============================================================ */
function openingBonus(){
  return S.foe && S.foe.offBalance ? 1.25 : 1;
}
function dmgStrike(){
  const f = S.foe;
  let d = (S.might + ri(0,4)) * openingBonus();
  if(f.revealed && f.weakness.eff.strikeBonus) d *= f.weakness.eff.strikeBonus;
  if(f.intent === "guard") d *= (1 - INTENTS.guard.armour);
  return Math.max(1, Math.round(d));
}
function heavyMultiplier(charge=S.heavyCharge){
  return charge >= 2 ? 4.7 : 2.7;
}
function dmgHeavy(charge=S.heavyCharge){
  const f = S.foe;
  const mult = heavyMultiplier(charge || 1);
  let d = (S.might*mult + ri(0,6)) * openingBonus();
  if(f.revealed && f.weakness.eff.heavyBonus) d *= f.weakness.eff.heavyBonus;
  // Heavy is the answer to a guard: most of the blow still gets through.
  if(f.intent === "guard") d *= 0.85;
  return Math.max(1, Math.round(d));
}
function counterDamage(style, perfect=false){
  // Counter damage intentionally uses Might but not random Strike damage, so the
  // preview can tell the truth. Perfect defence makes the return hit meaningfully
  // stronger without turning every normal block into an attack button.
  const mult = perfect
    ? (style === "shield" ? 0.75 : 1.25)
    : (style === "shield" ? 0.35 : 0.75);
  return Math.max(1, Math.round(S.might * mult));
}
function perfectDefenceReady(){
  // A blinded foe will miss on its own, so that swing neither spends nor
  // upgrades the defensive rhythm. Keep Perfect ready for a real attack.
  return S.defenceChain >= 1 && S.foe && !S.foe.blinded && INTENTS[S.foe.intent].kind === "attack";
}
function incoming(openMult=1){
  const f = S.foe;
  if(!f) return 0;
  const I = INTENTS[f.intent];
  if(I.kind !== "attack") return 0;
  return Math.max(0, Math.round(f.atk * I.mult * openMult));
}
function runCost(){
  const f = S.foe;
  if(f.revealed && f.weakness.eff.runFree) return 0;
  return Math.max(1, Math.round(4 + S.depth/26 + (f.intent === "heavy" ? 4 : 0)));
}
function defenceName(){ return S.loadout === "shield" ? "Guard" : "Parry"; }
function defenceReduction(){ return S.loadout === "shield" ? 0.25 : 0.45; }
function sandChance(){
  if(!S.foe) return 0;
  // Sand is a broad dirty trick, not a precision strike: Dodge does not help.
  // A foe already tucked behind its Guard is protected completely.
  if(S.foe.intent === "guard") return 0;
  return 0.60;
}

/* ============================================================
   ACTIONS
   Universal actions should create matchups, not replace class skills.
   ============================================================ */
const ACTIONS = {
  strike:{
    label:"Strike", sub:"3 stamina", cost:3,
    preview(){
      const f = S.foe, d = dmgStrike(), back = incoming();
      let s = `<span class="dmg">~${d} damage</span> · <span class="cost">3 stamina</span>`;
      if(f.offBalance) s += ` · <span class="dmg">+25% opening</span>`;
      if(f.intent === "dodge") s += ` · <span class="bad">35% miss chance</span>`;
      if(f.intent === "guard") s += ` · its guard soaks most of it`;
      if(back) s += ` · you take <span class="bad">~${back}</span> if it survives`;
      else s += ` · it is not attacking`;
      return s;
    },
    run(){
      const f = S.foe;
      if(f.intent === "dodge" && rnd() < 0.35)
        return `<p>Swung and found nothing. It was already elsewhere.</p>`;
      const d = dmgStrike();
      f.hp -= d;
      return `<p>${pick(HIT_VERBS)} the ${esc(f.name)} for <b>${d}</b>.</p>`;
    }
  },

  heavy:{
    label(){ return S.heavyCharge > 0 ? "Release heavy" : "Wind up heavy"; },
    sub(){
      if(S.heavyCharge >= 2) return "fully drawn · 4.7× might";
      if(S.heavyCharge === 1) return "ready · 2.7× might";
      return "6 stamina · prepares 2.7×";
    },
    cost(){ return S.heavyCharge > 0 ? 0 : 6; },
    preview(){
      const f = S.foe;
      if(S.heavyCharge === 0){
        const back = incoming();
        let s = `Prepare a <span class="dmg">2.7× Might</span> blow · <span class="cost">6 stamina</span> · <span class="bad">no damage yet</span>`;
        if(back) s += ` · you take <span class="bad">~${back}</span> while winding up`;
        else s += ` · <span class="dmg">safe opening: it is not attacking</span>`;
        s += ` · next turn: Release / Wind up further / ${defenceName()}`;
        return s;
      }

      const d = dmgHeavy(), back = incoming();
      const mult = heavyMultiplier();
      let s = `<span class="dmg">~${d} damage</span> · <span class="dmg">${mult.toFixed(1)}× Might</span> · <span class="cost">0 stamina</span> · releases before it acts`;
      if(f.offBalance) s += ` · <span class="dmg">+25% opening</span>`;
      if(f.intent === "dodge") s += ` · <span class="bad">70% miss chance</span>`;
      if(f.intent === "guard") s += ` · punches through most of its guard`;
      if(back) s += ` · you take <span class="bad">~${back}</span> if it survives`;
      else s += ` · it is not attacking`;
      return s;
    },
    run(){
      const f = S.foe;
      if(S.heavyCharge === 0){
        S.heavyCharge = 1;
        return `<p class="good">Drew back and prepared a <b>2.7×</b> heavy blow.</p>`;
      }

      const mult = heavyMultiplier();
      S.heavyCharge = 0;
      if(f.intent === "dodge" && rnd() < 0.70)
        return `<p>Released the ${mult.toFixed(1)}× heavy swing. It slipped clear before the blow arrived.</p>`;
      const d = dmgHeavy(mult >= 4.7 ? 2 : 1);
      f.hp -= d;
      return `<p>Brought it down hard — <b>${d}</b>${mult >= 4.7 ? " from the fully drawn blow" : ""}${f.intent === "guard" ? ", straight through most of the guard" : ""}.</p>`;
    }
  },

  draw:{
    label(){ return S.heavyCharge >= 2 ? "Fully drawn" : "Wind up further"; },
    sub(){ return S.heavyCharge >= 2 ? "can't draw any further" : "2 stamina · raises to 4.7×"; },
    cost:2,
    preview(){
      if(S.heavyCharge >= 2) return `The blow is already fully drawn. Release it or ${defenceName()} to abandon it.`;
      const back = incoming();
      const full = dmgHeavy(2);
      let s = `Commit another turn · <span class="cost">2 stamina</span> · raise the blow to <span class="dmg">4.7× Might (~${full} damage)</span>`;
      if(back) s += ` · you take <span class="bad">~${back}</span> while drawing further`;
      else s += ` · <span class="dmg">safe opening: it is not attacking</span>`;
      s += ` · then Release or ${defenceName()}`;
      return s;
    },
    run(){
      S.heavyCharge = 2;
      return `<p class="good">Drew the blow back further. It is <b>fully drawn — 4.7× Might</b>.</p>`;
    }
  },

  guard:{
    label(){ return perfectDefenceReady() ? `Perfect ${defenceName()}` : defenceName(); },
    sub(){ return perfectDefenceReady() ? "+3 stamina · 0 damage" : "+3 stamina"; },
    cost:-3,
    preview(){
      const f = S.foe;
      const perfect = perfectDefenceReady();
      let back = perfect ? 0 : Math.round(incoming() * defenceReduction());
      if(!perfect && f.revealed && f.weakness.eff.guardBonus) back = Math.round(back / f.weakness.eff.guardBonus);
      const full = S.stamina >= S.staminaMax;
      const style = S.loadout;
      let s = S.heavyCharge > 0
        ? `Abandon the prepared Heavy · recover <span class="cost">3 stamina</span>`
        : `Recover <span class="cost">3 stamina</span>`;
      if(perfect) s += ` · <span class="dmg">PERFECT: take 0 damage</span>`;
      else if(back) s += ` · take about <span class="bad">${back}</span>`;
      else s += ` · take no damage`;
      if(full && INTENTS[f.intent].kind === "attack"){
        const cd = counterDamage(style, perfect);
        if(perfect){
          s += style === "shield"
            ? ` · <span class="dmg">full stamina: perfect counter ~${cd}</span>`
            : ` · <span class="dmg">full stamina: perfect riposte ~${cd}</span>`;
        } else {
          s += style === "shield"
            ? ` · <span class="dmg">full stamina: counter ~${cd}</span>`
            : ` · <span class="dmg">full stamina: riposte ~${cd}</span>`;
        }
      }
      if(f.intent === "heavy") s += ` · <span class="dmg">Heavy Attack becomes Off-Balance</span>`;
      if(INTENTS[f.intent].kind === "attack" && !perfect) s += ` · <span class="dmg">sets up Perfect ${defenceName()}</span>`;
      return s;
    },
    run(){
      const abandonedHeavy = S.heavyCharge > 0;
      S.heavyCharge = 0;
      S.stamina = Math.min(S.staminaMax, S.stamina + 3);
      if(abandonedHeavy){
        return S.loadout === "shield"
          ? `<p class="good">Let the prepared blow go, set your shield, and recovered your stance.</p>`
          : `<p class="good">Let the prepared blow go and brought the blade back into a parry.</p>`;
      }
      return S.loadout === "shield"
        ? `<p class="good">Set your shield and caught your breath.</p>`
        : `<p class="good">Set the blade to meet the attack.</p>`;
    }
  },

  sand:{
    label:"Sand throw",
    sub(){
      if(S.foe && S.foe.intent === "guard") return "1 stamina · blocked by guard";
      return "1 stamina · 60% blind";
    },
    cost:1,
    preview(){
      const chance = Math.round(sandChance()*100);
      const back = incoming();

      if(S.foe.intent === "guard"){
        return `<span class="bad">Blocked by Guard</span> · <span class="cost">1 stamina</span> · 0% chance to Blind`;
      }

      let s = `<span class="dmg">${chance}% chance to cause Blinded</span> · <span class="cost">1 stamina</span>`;
      if(S.foe.intent === "dodge") s += ` · Dodge does not reduce the chance`;
      if(INTENTS[S.foe.intent].kind === "attack"){
        s += ` · success makes <span class="dmg">this attack miss</span>`;
        if(back) s += ` · failure means about <span class="bad">${back}</span> back`;
      } else {
        s += ` · Blinded persists until its next attack attempt`;
      }
      return s;
    },
    run(){
      const f = S.foe;
      if(f.intent === "guard"){
        return `<p>Threw the grit, but it disappeared harmlessly against the guard.</p>`;
      }
      if(rnd() < sandChance()){
        f.blinded = true;
        return `<p class="good">Threw grit into its face. It is <b>Blinded</b> until it next tries to attack.</p>`;
      }
      return `<p>The throw went wide. Nothing but dust between you.</p>`;
    }
  },

  read:{
    label:"Read it", sub:"1 stamina", cost:1,
    preview(){
      if(S.foe.revealed) return `Already read. You know what this one cannot take.`;
      const back = incoming();
      let s = `Learn its weakness — remembered for this species · <span class="cost">1 stamina</span>`;
      if(back) s += ` · you take <span class="bad">~${back}</span> while watching`;
      else s += ` · <span class="dmg">safe to study: it is not attacking</span>`;
      return s;
    },
    run(){
      const f = S.foe;
      if(f.revealed) return `<p class="note">Nothing new. You know this one.</p>`;
      f.revealed = true;
      known[f.key] = f.weakness;
      return `<p class="good">Watched instead of swinging. ${esc(f.weakness.txt)}</p>`;
    }
  }
};

function actionLabel(key){
  const v = ACTIONS[key].label;
  return typeof v === "function" ? v() : v;
}
function actionSub(key){
  const v = ACTIONS[key].sub;
  return typeof v === "function" ? v() : v;
}
function actionCost(key){
  const v = ACTIONS[key].cost;
  return typeof v === "function" ? v() : v;
}
function actionCounters(key){
  if(!S.foe) return false;
  const i = S.foe.intent;
  if(key === "guard") return i === "heavy" || i === "quick" || i === "offquick";
  if(key === "sand") return i === "heavy" || i === "quick" || i === "offquick";
  if(key === "strike") return i === "recover";
  if(key === "read") return i === "guard" || i === "dodge";
  if(key === "heavy"){
    if(S.heavyCharge > 0) return i === "guard" || i === "recover" || i === "steady" || S.foe.offBalance;
    return i === "dodge" || i === "guard" || i === "recover";
  }
  if(key === "draw") return false;
  return false;
}

/* ============================================================
   TAP TO PREVIEW, TAP AGAIN TO COMMIT

   First tap on an action arms it and fills in the preview.
   Second tap on the SAME action commits it.
   Tapping a different action just moves the arming across.
   ============================================================ */
function tapAction(key){
  if(over || !S.foe) return;

  if(armed !== key){        // first tap — arm it, show the numbers
    armed = key;
    render();
    return;
  }
  armed = null;             // second tap — go
  takeTurn(key);
}

function takeTurn(key){
  const A = ACTIONS[key];
  const cost = actionCost(key);
  if(cost > S.stamina) return;

  // Full-Stamina defence is an offensive choice. Capture it BEFORE Guard/Parry
  // restores Stamina, otherwise every near-full defence would accidentally counter.
  const defendedAtFull = key === "guard" && S.stamina >= S.staminaMax;
  const perfectDefence = key === "guard" && perfectDefenceReady();
  let madeOffBalance = false;

  // The defensive rhythm only survives while you keep choosing Guard/Parry.
  // Non-attacking enemy turns neither build nor consume it. Any other player
  // action breaks the chain.
  if(key !== "guard") S.defenceChain = 0;

  if(cost > 0) S.stamina -= cost;

  let out = A.run();

  // Player actions always resolve before the foe's declared intent.
  if(S.foe.hp <= 0){
    say(out + `<p class="said">The ${esc(S.foe.name)} went down and stayed down.</p>`);
    S.foe = null;
    S.heavyCharge = 0;
    S.defenceChain = 0;
    render();
    return;
  }

  const f = S.foe, I = INTENTS[f.intent];

  if(I.heal){
    const h = Math.round(f.hpMax * I.heal);
    f.hp = Math.min(f.hpMax, f.hp + h);
    out += `<p class="note">It gave ground and recovered <b>${h}</b> hp.</p>`;
  } else if(I.kind === "attack") {
    if(f.blinded){
      out += `<p class="good">${I.label}: blinded, it attacked empty air.</p>`;
      f.blinded = false;
    } else {
      let dmg = incoming();
      if(key === "guard"){
        if(perfectDefence){
          dmg = 0;
        } else {
          dmg = Math.round(dmg * defenceReduction());
          if(f.revealed && f.weakness.eff.guardBonus) dmg = Math.round(dmg / f.weakness.eff.guardBonus);
        }
      }

      if(dmg > 0){
        S.hp -= dmg;
        const attackText = f.intent === "heavy"
          ? "came down on you"
          : f.intent === "offquick"
            ? "caught you with a glancing cut"
            : "darted in";
        out += `<p class="hurt">${I.label}: it ${attackText} for <b>${dmg}</b>.</p>`;
      }

      // Guard/Parry only advances toward Perfect when the foe really attacks.
      // The second successfully defended attack is Perfect, then the rhythm resets.
      if(key === "guard" && S.hp > 0){
        if(perfectDefence){
          S.defenceChain = 0;
          out += `<p class="good"><b>Perfect ${defenceName()}.</b> The attack never got through.</p>`;
        } else {
          S.defenceChain = 1;
          out += `<p class="note">Kept the defensive rhythm. The next defended attack can be a <b>Perfect ${defenceName()}</b>.</p>`;
        }
      }

      // Guard/Parry only creates an opening when you actually meet a committed
      // Heavy Attack. A blind miss does not count as a successful defence.
      if(key === "guard" && f.intent === "heavy" && S.hp > 0){
        f.offBalance = true;
        f.offBalanceStruck = false;
        madeOffBalance = true;
        out += `<p class="good">The committed blow carried it past its footing. <b>Off-Balance.</b></p>`;
      }

      // At full Stamina, defence stops being a wasted action: shield users get
      // a modest counter, sword-only users risk more damage for a stronger riposte.
      if(key === "guard" && defendedAtFull && S.hp > 0){
        const cd = counterDamage(S.loadout, perfectDefence);
        f.hp -= cd;
        if(perfectDefence){
          out += S.loadout === "shield"
            ? `<p class="good">Perfectly caught the attack and drove the shield back for <b>${cd}</b>.</p>`
            : `<p class="good">Perfectly turned the attack aside and riposted for <b>${cd}</b>.</p>`;
        } else {
          out += S.loadout === "shield"
            ? `<p class="good">Caught it on the shield and answered for <b>${cd}</b>.</p>`
            : `<p class="good">Turned the blow aside and riposted for <b>${cd}</b>.</p>`;
        }
      }
    }

    // Choosing to attack while Off-Balance buys aggression at the cost of
    // staying vulnerable for one more player turn. Steady is forced next.
    if(f.intent === "offquick" && f.offBalance && !madeOffBalance){
      f.offBalanceStruck = true;
      out += `<p class="note">It lashed out instead of recovering its footing. It is still <b>Off-Balance</b>.</p>`;
    }
  } else {
    out += `<p class="note">${I.label}: it did not attack.</p>`;

    // Steady spends the enemy's entire action and clears Off-Balance only
    // after the player has had this turn to exploit the opening.
    if(f.intent === "steady" && f.offBalance){
      f.offBalance = false;
      f.offBalanceStruck = false;
      out += `<p class="note">It found its footing again.</p>`;
    }
  }

  if(S.hp <= 0) return die(out);

  if(f.hp <= 0){
    say(out + `<p class="said">The ${esc(f.name)} went down and stayed down.</p>`);
    S.foe = null;
    S.heavyCharge = 0;
    S.defenceChain = 0;
    render();
    return;
  }


  // Base passive Stamina regeneration is intentionally 0. Guard/Parry is the
  // universal reset; later stat thresholds can earn passive regeneration.
  S.turn++;
  rollIntent();
  say(out);
  render();
}

function tapRun(){
  if(over || !S.foe || S.heavyCharge > 0) return;
  if(armed !== "run"){ armed = "run"; render(); return; }
  armed = null;

  const c = runCost();
  S.hp -= c;
  if(S.hp <= 0) return die(`<p class="hurt">Turned to run. Did not get far.</p>`);

  say(`<p class="said">Broke contact and did not look back.</p>` +
      (c ? `<p class="hurt">It cost <b>${c}</b> on the way out.</p>`
         : `<p class="note">It let you go.</p>`));
  S.foe = null;
  S.heavyCharge = 0;
  S.defenceChain = 0;
  render();
}

function die(out){
  over = true;
  say(out + `<p class="hurt said">You did not get up.</p>`);
  render();
  setTimeout(() => {
    const d = document.createElement("div");
    d.className = "dead";
    d.innerHTML =
      `<h2>${esc(S.name)}, ended at ${S.depth} fathoms</h2>
       <p>The chronicle closes here. The next delver starts clean.</p>
       <button id="btnNew">Sign a new delver</button>`;
    $("arena").appendChild(d);
    $("btnNew").addEventListener("click", () => { d.remove(); newDelver(); });
  }, 1200);
}


/* ============================================================
   RENDER — repaints the whole screen from S
   ============================================================ */
function say(html){
  const r = $("readout");
  r.innerHTML = html;
  r.scrollTop = 0;
}

function hpClass(el, frac){
  el.classList.toggle("mid", frac <= 0.50 && frac > 0.22);
  el.classList.toggle("low", frac <= 0.22);
}

function render(){
  $("meta").textContent = `${S.depth} fathoms · encounter ${S.encounter}`;
  $("heroName").textContent = S.name;
  $("heroLv").textContent = "Rank " + S.rank;

  // you
  const hf = clamp(S.hp/S.hpMax, 0, 1);
  hpClass($("heroBar"), hf);
  $("heroHp").style.width = hf*100 + "%";
  $("heroHpN").textContent = `${Math.max(0,S.hp)} / ${S.hpMax}`;

  // stamina pips
  let pips = "";
  for(let i = 0; i < S.staminaMax; i++) pips += `<i class="${i < S.stamina ? "on" : ""}"></i>`;
  $("pips").innerHTML = pips;
  $("staminaN").textContent = `${S.stamina} / ${S.staminaMax}`;

  // the foe
  const f = S.foe;
  if(f){
    $("foeName").textContent = f.name;
    $("foeLv").textContent = "Lv. " + f.lv;
    const ff = clamp(f.hp/f.hpMax, 0, 1);
    hpClass($("foeBar"), ff);
    $("foeHp").style.width = ff*100 + "%";
    $("foeHpN").textContent = `${Math.max(0,f.hp)} / ${f.hpMax}`;

    $("intent").classList.remove("unknown");
    const I = INTENTS[f.intent];
    $("intent").innerHTML = `<em>Intent</em><b>${esc(I.label)} — ${esc(I.tell)}</b>`;

    $("tell").hidden = !f.revealed;
    if(f.revealed) $("tellTxt").textContent = f.weakness.txt;

    const statuses = [];
    if(f.offBalance){
      const suffix = f.offBalanceStruck ? " · must steady" : " · exposed";
      statuses.push(`<span class="status offbalance">Off-Balance${suffix}</span>`);
    }
    if(f.blinded) statuses.push(`<span class="status blinded">Blinded</span>`);
    $("foeStatus").hidden = statuses.length === 0;
    $("foeStatus").innerHTML = statuses.join("");
  } else {
    $("foeName").textContent = "—";
    $("foeLv").textContent = "";
    $("foeHp").style.width = "0%";
    $("foeHpN").textContent = "";
    $("intent").classList.add("unknown");
    $("intent").innerHTML = `<em>Intent</em><b>nothing in front of you</b>`;
    $("tell").hidden = true;
    $("foeStatus").hidden = true;
    $("foeStatus").innerHTML = "";
  }

  $("loadoutTxt").textContent = S.loadout === "shield" ? "sword + shield · Guard" : "sword only · Parry";

  renderPad();
  renderPreview();

  // the bottom bar: Run during a fight, Go on down after one
  $("btnRun").hidden = !f || over;
  $("btnGo").hidden = !!f || over;
  if(f){
    const c = runCost();
    const fatal = c >= S.hp;
    const btn = $("btnRun");
    btn.disabled = S.heavyCharge > 0;
    btn.classList.toggle("fatal", fatal && S.heavyCharge === 0);
    btn.classList.toggle("armed", armed === "run");
    btn.querySelector("b").textContent = armed === "run" ? "Run — commit?" : "Run";
    btn.querySelector("span").textContent =
      S.heavyCharge > 0 ? `heavy prepared · Release or ${defenceName()} to abandon`
      : armed === "run" ? "tap again to break contact"
      : fatal          ? `costs ${c} hp · that kills you`
      : c === 0        ? `it will not follow · you keep nothing`
      :                  `costs ${c} hp · you keep nothing`;
  }
}

function renderPad(){
  // Once a Heavy is prepared, the normal pad collapses to the three decisions
  // that matter: cash out, commit deeper, or defend and abandon the blow.
  const order = S.heavyCharge > 0
    ? ["heavy","draw","guard"]
    : ["strike","heavy","guard","sand","read"];

  $("pad").innerHTML = order.map(k => {
    const cost = actionCost(k);
    const fullyDrawn = k === "draw" && S.heavyCharge >= 2;
    const off = !S.foe || over || fullyDrawn || cost > S.stamina;
    const counters = S.foe && actionCounters(k);
    const isArmed = armed === k;
    const baseSub = actionSub(k);
    const sub = isArmed ? "tap again to commit"
              : (S.foe && cost > S.stamina) ? `${baseSub} — short`
              : baseSub;
    const wide = (S.heavyCharge > 0 && k === "guard") || k === "read" ? "wide" : "";
    return `<button class="act ${k} ${wide} ${counters ? "counter" : ""} ${isArmed ? "armed" : ""}"
              data-k="${k}" ${off ? "disabled" : ""}>
              <b>${actionLabel(k)}</b><span>${sub}</span></button>`;
  }).join("");
}

function renderPreview(){
  const p = $("preview");
  if(!S.foe || over || !armed || armed === "run"){
    p.classList.add("idle");
    const idleLine = !S.foe ? "Nothing in front of you."
      : S.heavyCharge >= 2 ? `Heavy fully drawn: Release it, or ${defenceName()} to abandon it.`
      : S.heavyCharge === 1 ? `Heavy prepared: Release it, Wind up further, or ${defenceName()} to abandon it.`
      : "Tap an action to see what it costs.";
    p.innerHTML = `<div class="ttl">If you commit to that</div>
                   <div class="line">${idleLine}</div>`;
    return;
  }
  p.classList.remove("idle");
  p.innerHTML = `<div class="ttl">If you commit to that</div>
                 <div class="line">${ACTIONS[armed].preview()}</div>`;
}


/* ============================================================
   WIRING — connecting the buttons to the functions above
   ============================================================ */
$("pad").addEventListener("click", e => {
  const b = e.target.closest(".act");
  if(!b || b.disabled) return;
  tapAction(b.dataset.k);
});

$("btnRun").addEventListener("click", tapRun);

$("btnGo").addEventListener("click", () => {
  S.depth += ri(3,9);
  nextFoe();
});

$("btnSkills").addEventListener("click", () => { $("sheet").hidden = false; });
$("btnLoadout").addEventListener("click", () => {
  if(S.heavyCharge > 0) return;
  S.loadout = S.loadout === "shield" ? "sword" : "shield";
  S.defenceChain = 0;
  armed = null;
  say(S.loadout === "shield"
    ? `<p class="note">Test loadout: sword and shield. Defence is now <b>Guard</b>.</p>`
    : `<p class="note">Test loadout: sword only. Defence is now <b>Parry</b>.</p>`);
  render();
});
$("btnBack").addEventListener("click", () => { $("sheet").hidden = true; });
$("scrim").addEventListener("click", () => { $("sheet").hidden = true; });

newDelver();
</script>
</body>
</html>
