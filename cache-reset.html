<!doctype html><meta charset="utf-8"><title>Lowfathom Cache Reset</title><body style="background:#010406;color:#c2bdb1;font:16px monospace;padding:24px"><p>Clearing old Lowfathom caches…</p><script>(async()=>{for(const k of await caches.keys())if(k.startsWith('lowfathom-'))await caches.delete(k);for(const r of await navigator.serviceWorker?.getRegistrations?.()||[])await r.unregister();document.body.innerHTML='<p>Cache cleared. Reloading Lowfathom…</p>';setTimeout(()=>location.replace('./index.html?fresh='+Date.now()),500)})().catch(e=>document.body.innerHTML='<pre>'+e+'</pre>');</script></body>
